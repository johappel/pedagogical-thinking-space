reason: >
  Der Lehrkraft ist die pädagogische Spannung klar: In der ersten Stunde hat ein Schüler
  gesagt, Religion sei in der Schule überflüssig. Die Klasse 9 (Gesamtschule NRW) steht
  unter Prüfungsdruck für die Realschulreife. Die Frage lautet: Wie lässt sich der
  Religionsunterricht so beginnen, dass die Zweifel der Schüler ernst genommen werden,
  ohne das Fach zu verteidigen – und zwar so, dass die Schüler selbst spüren, warum
  das Fach für sie relevant sein könnte?
