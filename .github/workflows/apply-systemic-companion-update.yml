name: Apply systemic companion update

on:
  push:
    branches:
      - agent/systemic-reflection-companion
    paths:
      - '.systemic-payload/**'
      - '.github/workflows/apply-systemic-companion-update.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/systemic-reflection-companion
          fetch-depth: 0

      - name: Restore source changes
        shell: bash
        run: |
          set -euo pipefail
          cat .systemic-payload/part-* | base64 --decode > /tmp/systemic-update.tar.gz
          tar -xzf /tmp/systemic-update.tar.gz -C .

      - name: Install proposal dependency
        run: python -m pip install --disable-pip-version-check reportlab

      - name: Validate repository contracts
        run: python scripts/check_repo.py

      - name: Build scientific proposal
        run: python scripts/build_scientific_proposal.py

      - name: Commit final update
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .systemic-payload
          rm -f .github/workflows/apply-systemic-companion-update.yml
          git config user.name 'ptspace-update-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Develop the companion into a systemic reflective partner'
          git push origin HEAD:agent/systemic-reflection-companion
