name: Repo Check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run repo consistency checks
        run: python scripts/check_repo.py

      - name: Run architecture and Steward tests
        run: node --test tests/*.test.mjs dsh-plugins/pts-background-steward/test/*.test.mjs

      - name: Run activity projection checks
        run: node dsh-plugins/pts-activity-stream/test-activity.cjs
