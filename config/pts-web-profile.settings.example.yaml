# Profile-local settings for the first DSH-native PTS prototype.
agent-presets:
  default: pts-companion

agent-default-model:
  provider: deepseek-official
  model: deepseek-v4-flash
  reasoningEffort: off

# This route is only for post-turn Denkstand maintenance. Worker routes live in
# dsh-presets/pts-companion/agent.cordis.yml.
pts-background-steward:
  provider: ollama
  model: qwen3.8:27b
  maxTokens: 8192
  reasoningEffort: low

# Rolle-Skill-Matrix des pts-skill-manager (Skills-Tab). Werte = Skill-IDs aus
# der Repo-Bibliothek skills/<id>/SKILL.md. Der Steward- und der Skills-Writer
# ersetzen je nur ihre eigene Sektion atomar (fremde Sections bleiben erhalten).
pts-worker-skills:
  research: [google-search]
  material: [ppt-builder]
  review: []
  renderer: []

