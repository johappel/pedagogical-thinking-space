# Profile-local settings for the first DSH-native PTS prototype.
agent-presets:
  default: pts-companion

agent-default-model:
  provider: deepseek-official
  model: deepseek-v4-flash
  reasoningEffort: off

# Rolle-Skill-Matrix des pts-skill-manager (Skills-Tab). Werte = Skill-IDs aus
# der Repo-Bibliothek skills/<id>/SKILL.md. Der Skills-Writer ersetzt nur seine
# eigene Sektion atomar (fremde Sections bleiben erhalten).
pts-worker-skills:
  research: [google-search]
  material: [ppt-builder]
  review: []
  renderer: []

