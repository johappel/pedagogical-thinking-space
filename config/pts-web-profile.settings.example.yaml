# Profile-local settings for the first DSH-native PTS prototype.
agent-presets:
  default: pts-companion

agent-default-model:
  provider: deepseek-official
  model: deepseek-v4-flash
  reasoningEffort: off

# This route is only for post-turn Denkstand maintenance. Worker routes live in
# dsh-presets/pts-companion/agent.cordis.yml.
pts-background-steward:
  provider: ollama
  model: qwen3.8:27b
  maxTokens: 8192
  reasoningEffort: low

# Rolle-Skill-Matrix des pts-skill-manager (Skills-Tab). Werte = Skill-IDs aus
# der Repo-Bibliothek skills/<id>/SKILL.md. Der Steward- und der Skills-Writer
# ersetzen je nur ihre eigene Sektion atomar (fremde Sections bleiben erhalten).
pts-worker-skills:
  research: [google-search]
  material: [ppt-builder]
  review: []
  renderer: []

# Parallel configuration for dsh-plugin-subagent-director. The legacy
# pts-workers in agent.cordis.yml remain active until each role passes M2.
subagent-director:
  roles:
    pts-researcher:
      displayName: PTS Researcher
      description: Research a bounded public question and verify sources.
      persona: Work only on the delegated research question. Return sources, dates, exact loci and uncertainty.
      provider: deepseek-official
      model: deepseek-v4-flash
      toolFilter:
        allow: [read, glob, grep, web_search, write, edit, skill]
    pts-editor:
      displayName: PTS Editor
      description: Apply an already agreed precise document edit.
      persona: Apply only the agreed mechanical edit. Do not reinterpret, extend or decide pedagogy.
      provider: deepseek-official
      model: deepseek-v4-flash
      toolFilter:
        allow: [read, glob, grep, write, edit]
    pts-document-worker:
      displayName: PTS Documentation Worker
      description: Record a supplied process or outcome as factual documentation.
      persona: Capture facts without inventing content or adding pedagogical judgement. Return the created path.
      provider: deepseek-official
      model: deepseek-v4-flash
      toolFilter:
        allow: [read, glob, grep, write, edit]
    pts-material-worker:
      displayName: PTS Material Worker
      description: Produce a reviewable draft from an established pedagogical intention.
      persona: Implement only the supplied intention and constraints. State assumptions and write only to the requested draft path.
      provider: deepseek-official
      model: deepseek-v4-flash
      toolFilter:
        allow: [read, glob, grep, write, edit, skill]
    pts-reviewer:
      displayName: PTS Review Worker
      description: Review mandate fit, evidence, assumptions, accessibility and risks.
      persona: Review the supplied design and result. Return a concise verdict and revision requests. Do not edit files.
      provider: deepseek-official
      model: deepseek-v4-flash
      toolFilter:
        allow: [read, glob, grep]
    pts-renderer:
      displayName: PTS Renderer
      description: Convert an approved source draft into the requested target format.
      persona: Preserve meaning and learning design. Write only below rendered/<format>/ and report contradictions.
      provider: deepseek-official
      model: deepseek-v4-flash
      toolFilter:
        allow: [read, glob, grep, write, edit]

