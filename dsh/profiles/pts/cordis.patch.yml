# PTS instance — HOST plane. Canonical source: <repo>/dsh/profiles/pts/cordis.patch.yml
#
# Rendered into $DSH_HOME/profiles/pts/cordis.patch.yml by
# scripts/install-pts-instance.ps1, which replaces two placeholders with
# absolute paths: `@PTS_ROOT@` is this repository (the definition: preset,
# patch, contracts) and `@PTS_DATA_ROOT@` is this instance's data area (the
# content: Denkräume, knowledge, skills). This layer sits on top of
# dsh-base and dsh-web-app; the profile patch wins against a bundle layer, and a
# patch REPLACES the whole `config` of a targeted row (restate every key you
# keep).
#
# What belongs here (host plane): the registry rows and anything shared across
# sessions — the roster default, the port, the fallback workspace root, and
# installed capabilities. What the SESSION contributes — persona, prompt
# sections, tools, worker roles — stays in one place as well, because dsh 0.2
# declares a preset as an ordinary row: the `preset-pts-companion` block below
# is the whole per-session composition, taken verbatim from
# <repo>/dsh/presets/pts-companion/agent.cordis.yml (the legacy 0.1.7 form,
# still rendered into $DSH_HOME/.agent-presets by the installer for rollback).
# Keep the two in sync when the composition changes; only the declaration row
# is mounted by dsh 0.2.
#
# dsh 0.2 path rule: the declaration is mounted from the RENDERED patch, so a
# preset-local `./module.mjs` or `baseUrl`-relative asset would resolve beside
# $DSH_HOME/profiles/pts instead of the preset directory. Every module and
# asset path therefore uses the installer-substituted `@PTS_ROOT@`, exactly
# like the host rows above.

# Port 3030 is this profile's fallback; the app argument --port still wins.
- id: webserver
  name: '@deepseek-ai/dsh-host-webserver'
  inject: [webStartup]
  config:
    host: !!js ctx.webStartup.host ?? '127.0.0.1'
    port: !!js ctx.webStartup.port ?? 3030

# Fallback root for agentless calls and sessions without a cwd ("Normal agent
# calls use their session cwd instead"). It is NOT the session workspace: a
# Denkraum becomes the session cwd by invoking dsh from it or picking it in
# the UI. `mode` has the fail-safe default read-only, so state it explicitly.
#
# The root is the INSTANCE DATA area, never the repository. PTS keeps the
# definition (this repo: preset, patch, contracts, .git) and the content
# (Denkräume, knowledge, skills under <dataRoot>) apart, so a worker's write can
# reach its Denkraum but never the composition that governs it.
- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: '@PTS_DATA_ROOT@/denkraeume'

# dsh 0.2: the roster moved. `@deepseek-ai/dsh-agent-presets` (the directory
# scan of <DSH_HOME>/.agent-presets, driven by this row's `default`) is retired;
# `agent-preset-registry` names a DECLARED preset id and the declaration itself
# is the `preset-pts-companion` row below. `default` fails loud when the id is
# not declared, so both rows belong together in this patch.
- id: agent-preset-registry
  name: '@deepseek-ai/dsh-agent-preset-registry'
  config:
    default: pts-companion

- insert:
    # ── the PTS agent preset as a dsh 0.2 declaration ──────────────────────
    # Registry row + this row replace the retired roster: the registry mounts
    # presets only from declarations, never from .agent-presets directories.
    # `plugins` stays a single source: the native `cordis:include` carrier
    # loads the composition file (an entry list) instead of inlining it. The
    # path is RELATIVE because two rules pin the target inside the profile
    # tree: (1) the Include constructor resolves `new URL(path, baseUrl)`, so a
    # bare `F:/...` would parse as scheme `f:` and fail with "The URL must be
    # of scheme file" (observed 2026-09-29); (2) bare package names are only
    # intercepted for files under the profiles tree, so including the repo copy
    # directly fails with ERR_MODULE_NOT_FOUND for every @deepseek-ai package
    # (same date). The installer copies the validated rendering to
    # $DSH_HOME/profiles/pts/pts-companion/, which this relative path reaches
    # from this patch file's base URL.
    - id: preset-pts-companion
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: pts-companion
        name: PTS Companion
        description: >-
          Pädagogischer Companion des Denkraums: kritischer Freund und Berater
          der Lehrkraft, mit den sieben spezialisierten PTS-Rollen (research,
          edit, document, documentarian, material, review, renderer) als native
          DSH-Subagenten.
        plugins:
          - id: pts-companion-composition
            name: cordis:include
            config:
              path: 'pts-companion/agent.cordis.yml'

    # Optional capability, installed independently of PTS Core. Flip `disabled`
    # to false to prove additivity: the Companion sees the extra tool in the
    # next session, and PTS Core needs no change either way.
    - id: pts-demo-capability
      name: '@PTS_ROOT@/plugins/pts-demo-capability/lib/index.js'
      disabled: true

    # Whiteboard spike: a host-plane capability with its own tools. PTS Core
    # does not know it; it only shares the composition.
    - id: dsh-whiteboard
      name: dsh-whiteboard
      inject: [webServer]

    # Phase 1 spike: semantic plan validation and deterministic rendering seam.
    # It is intentionally separate from the read-only M1 adapter and has no
    # domain-store or LearningMoment persistence authority.
    - id: pts-whiteboard-renderer
      name: '@PTS_ROOT@/plugins/pts-whiteboard-renderer/lib/index.js'
      inject: [webServer, agents]

    # Phase 2 — LearningMoment domain binding. The single domain write-seam:
    # capture/bind/move/detach/update over the canonical landscape moment plus
    # the projection ledger. It exposes the semantic Companion façade
    # pts_learning_moment and drives the GENERIC dsh-whiteboard move seam; it
    # holds the domain authority the renderer deliberately does not.
    - id: pts-learning-moment-binding
      name: '@PTS_ROOT@/plugins/pts-learning-moment-binding/lib/index.js'
      inject: [webServer, sessions, agents]

    # M1 spike — pts-whiteboard-adapter. Bridges the two rows above without
    # coupling them: it reads the EXISTING whiteboard_state definition and
    # projects a compact board context into pts-companion sessions through the
    # system-prompt/assemble waterfall. It publishes no service, registers no
    # tool and starts no turn. Deleting this row leaves PTS Core and the
    # whiteboard untouched; `disabled: true` is the cheap off switch.
    - id: pts-whiteboard-adapter
      name: '@PTS_ROOT@/plugins/pts-whiteboard-adapter/lib/index.js'
      inject: [agents]

    # The single write-seam for the current Denkstand. Registers pts_denkstand,
    # through which the Documentarian moves the canonical current state
    # (record/confirm/open/hypothesize/reject/supersede) into
    # .pts/denkstand-state.json. The additive Markdown files stay as narrative;
    # this is the structured current state that reaches the Companion before a
    # turn (pts-context.mjs). Registers no HTTP route and starts no turn.
    - id: pts-denkstand-writer
      name: '@PTS_ROOT@/plugins/pts-denkstand-writer/lib/index.js'
      inject: [webServer, agents]

    # Phase 3 spike — the teacher-facing "Unterrichtsreihe" editor. A WEB UI
    # plugin: resolved by bare name through a junction in the profile
    # node_modules (like dsh-whiteboard), so the client roster scan finds its
    # `./client` bundle. Its floating opener sits next to `.wb-opener`; it
    # registers the /pts-teaching-product HTTP route plus the collab WebSocket
    # upgrade, and persists product/proposal/snapshot sidecars in the Denkraum's
    # .pts/. It knows the Teaching Product domain but holds no Denkstand or
    # LearningMoment write authority — the product boundary stays one-way.
    - id: pts-teaching-product-editor
      name: pts-teaching-product-editor
      inject: [webServer]

    # pts-activity-stream - pure client UI takeover of conversation.chat.node
    # (keys tool-call + context @ priority -1). Resolved by bare name through
    # the profile node_modules junction; no HTTP route, no service, no state.
    - id: pts-activity-stream
      name: pts-activity-stream

# ── instance defaults: model route and welcome notice ────────────────────────
# These three rows lived only in the rendered pts-017 patch (hand-added on
# 2026-09-11) and are canonicalized here so every render reproduces them. They
# patch existing dsh-base/dsh-web-app rows; verified present in dsh 0.2.0-rc.1.
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-08-13.1
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: bai
    model: deepseek-v4.1-flash
    reasoningEffort: high
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      bai:
        displayName: b.ai
        apiKeyEnv: BAI_API_KEY
        api: anthropic-messages
        baseURL: https://api.b.ai
        models:
          - id: deepseek-v4.1-flash
            name: deepseek-v4.1-flash
            reasoningEfforts:
              off: null
              low: low
              high: high
              max: max
          - id: gemini-3.8-flash
            name: gemini-3.8-flash
            reasoningEfforts:
              off: null
              low: low
              high: high
              max: max
      openrouter:
        apiKeyEnv: OPENROUTER_API_KEY

